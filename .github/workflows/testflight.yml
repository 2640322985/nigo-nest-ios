name: TestFlight

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install signing files
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          IOS_PROFILE_WIDGET_BASE64: ${{ secrets.IOS_PROFILE_WIDGET_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$IOS_P12_BASE64" | base64 --decode > dist.p12
          echo "$IOS_PROFILE_APP_BASE64" | base64 --decode > app.mobileprovision
          echo "$IOS_PROFILE_WIDGET_BASE64" | base64 --decode > widget.mobileprovision
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import dist.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp app.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision"
          cp widget.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/widget.mobileprovision"

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          empty = """<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict></dict></plist>
          """
          for path in ("NigoNest/NigoNest.entitlements", "Widgets/Widget.entitlements"):
              Path(path).write_text(empty, encoding="utf-8")
          PY
          brew install xcodegen
          xcodegen generate

      - name: Archive and export
        run: |
          set -euo pipefail
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>2326DQSJ7V</string>
            <key>uploadSymbols</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.nigo.nest</key>
              <string>NigoNest App Store</string>
              <key>com.nigo.nest.widget</key>
              <string>NigoNest Widget App Store</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -project NigoNest.xcodeproj \
            -scheme NigoNest \
            -destination 'generic/platform=iOS' \
            -archivePath build/NigoNest.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=2326DQSJ7V \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath build/NigoNest.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(find build/export -name '*.ipa' | head -n 1)
          echo "IPA=$IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
