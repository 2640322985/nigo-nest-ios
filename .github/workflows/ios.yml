name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ui/black-white-campus]

permissions:
  contents: read

jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Build actual application and widget
        run: |
          set -o pipefail
          xcodebuild -project NigoNest.xcodeproj -scheme NigoNest -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_STYLE=Automatic build | tee build.log
      - name: Verify release build excludes preview entry point
        run: |
          set -o pipefail
          xcodebuild -project NigoNest.xcodeproj -scheme NigoNest -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath release-build CODE_SIGNING_ALLOWED=NO CODE_SIGN_STYLE=Automatic build | tee release.log
      - name: Capture actual UI through navigation tests
        timeout-minutes: 18
        run: |
          set -o pipefail
          UDID=$(xcrun simctl create nigo-ui 'iPhone 17' com.apple.CoreSimulator.SimRuntime.iOS-27-1)
          xcodebuild -project NigoNest.xcodeproj -scheme NigoNest -configuration Debug -destination "platform=iOS Simulator,id=$UDID" -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -derivedDataPath build -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO CODE_SIGN_STYLE=Automatic test | tee tests.log
      - name: Export screenshot attachments and test results
        if: always()
        run: |
          mkdir -p screenshots
          xcodebuild -version > screenshots/environment.txt
          printf '\nSource: native XCUIScreen screenshots of production SwiftUI views.\nData: local demonstration fixtures. Device: iPhone 17 SIMULATOR / iOS 27.1, not physical iPhone.\n' >> screenshots/environment.txt
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots
            xcrun xcresulttool get test-results summary --path TestResults.xcresult > screenshots/test-summary.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-evidence
          path: |
            screenshots/
            build.log
            tests.log
            release.log
            TestResults.xcresult
