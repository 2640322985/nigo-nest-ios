name: Build iOS

on:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the iOS Simulator
        run: |
          xcodebuild \
            -project NigoNest.xcodeproj \
            -scheme NigoNest \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot a simulator and capture the pages
        run: |
          set -euo pipefail
          DEVICE_TYPE=$(xcrun simctl list devicetypes | sed -n 's/.*(\(com.apple.CoreSimulator.SimDeviceType.iPhone-1[56]\)).*/\1/p' | head -n 1)
          RUNTIME=$(xcrun simctl list runtimes | sed -n 's/.* - \(com.apple.CoreSimulator.SimRuntime.iOS-[^ ]*\).*/\1/p' | tail -n 1)
          echo "DEVICE_TYPE=$DEVICE_TYPE RUNTIME=$RUNTIME"
          UDID=$(xcrun simctl create nigo-preview "$DEVICE_TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -name '*.app' -path '*iphonesimulator*' ! -path '*Widget*' | head -n 1)
          echo "APP=$APP"
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          capture() {
            xcrun simctl terminate "$UDID" com.nigo.nest || true
            xcrun simctl launch "$UDID" com.nigo.nest -preview "$1"
            sleep 4
            xcrun simctl io "$UDID" screenshot "screenshots/$1.png"
          }
          capture login
          capture plaza
          capture profile

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
