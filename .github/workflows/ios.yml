name: Build iOS

on:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the iOS Simulator
        run: |
          xcodebuild \
            -project NigoNest.xcodeproj \
            -scheme NigoNest \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
