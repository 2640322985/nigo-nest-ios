name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ui/black-white-campus]

permissions:
  contents: read

jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Test theme defaults and persistence across processes
        run: |
          set -o pipefail
          swiftc NigoNest/Services/AppTheme.swift Tests/ThemeState/main.swift -o /tmp/nigo-theme-check
          /tmp/nigo-theme-check "nigo.theme-test.${GITHUB_RUN_ID}" seed
          /tmp/nigo-theme-check "nigo.theme-test.${GITHUB_RUN_ID}" reload
          /tmp/nigo-theme-check "nigo.theme-test.${GITHUB_RUN_ID}" fallback
      - name: Build themed application and widget
        run: |
          set -o pipefail
          xcodebuild -project NigoNest.xcodeproj -scheme NigoNest -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_STYLE=Automatic build | tee build.log
      - name: Verify release build excludes preview entry point
        run: |
          set -o pipefail
          xcodebuild -project NigoNest.xcodeproj -scheme NigoNest -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath release-build CODE_SIGNING_ALLOWED=NO CODE_SIGN_STYLE=Automatic build | tee release.log
      - name: Run application and capture native screens
        timeout-minutes: 22
        shell: bash
        run: bash scripts/capture-ios.sh 2>&1 | tee native-ui.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-evidence
          path: |
            screenshots/
            build.log
            tests.log
            release.log
            native-ui.log
