name: NigoNest
options:
  bundleIdPrefix: com.nigo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: "2326DQSJ7V"
targets:
  NigoNest:
    type: application
    platform: iOS
    sources:
      - path: NigoNest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nigo.nest
        PRODUCT_NAME: 泥工小窝
        INFOPLIST_FILE: NigoNest/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: NigoNest/NigoNest.entitlements
    dependencies:
      - target: NigoNestWidget
        embed: true
    scheme:
      gatherCoverageData: false
  NigoNestWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nigo.nest.widget
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widgets/Widget.entitlements
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      gatherCoverageData: false
